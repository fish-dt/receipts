AWSTemplateFormatVersion: "2010-09-09"
Description: Receipts state table and log group (no IAM resources; attach your own role)
Parameters:
  TableName: {Type: String, Default: receipts-state}
Resources:
  ReceiptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: job_id, AttributeType: S}]
      KeySchema: [{AttributeName: job_id, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /receipts/gate, RetentionInDays: 30}
Outputs:
  Table: {Value: !Ref ReceiptsTable}
