[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receipts"
version = "0.2.0"
description = "Rule-bound agent that migrates legacy batch jobs to AWS artifacts and issues a verifiable receipt."
requires-python = ">=3.10"
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
agents = ["strands-agents"]
app = ["streamlit"]
dev = ["pytest>=8", "ruff"]

[project.scripts]
receipts = "receipts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
receipts = ["kb/*.md", "samples/jobs/*.sh", "samples/fixture/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 125
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
